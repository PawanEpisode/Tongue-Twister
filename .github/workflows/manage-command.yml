name: Management command

# Runs an API management command against the production database, either on a schedule or by hand
# (Actions → "Management command" → Run workflow).
#
# To add a command: append its name to ALLOWED below; to schedule it, add a cron here and a matching
# line in the "Resolve command" case statement. Nothing else changes.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Management command (must be in the allow-list in this workflow)"
        required: true
        default: reconcile_speak_stats
      args:
        description: "Optional arguments, e.g. --check or --profile <uuid>"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *" # nightly 03:17 UTC — reconcile_speak_stats
    - cron: "23 * * * *" # hourly at :23 — expire_recordings (retention, hard delete, consent revocations)
    - cron: "41 4 * * *" # daily 04:41 UTC — orphan_sweeper (abandoned uploads)
    - cron: "37 * * * *" # hourly at :37 — build_leaderboard (weekly boards; harmless while `weekly_boards` is off)
    - cron: "7 * * * *" # hourly at :07 — send_reminders (practice reminder e-mails; does nothing while the `reminders` flag is off)
    - cron: "53 * * * *" # hourly at :53 — purge_deleted_accounts (accounts whose 30-day deletion grace period is over)
    - cron: "19 5 * * *" # daily 05:19 UTC — prune_generation_usage (quota ledger rows older than 90 days)
    - cron: "41 * * * *" # hourly at :41 — refresh_public_stats (landing-page social-proof counters)
    - cron: "*/10 * * * *" # every 10 min — sweep_pending_attempts (re-queue lapsed scoring leases, expire dead jobs; a no-op while no worker is deployed)

# Two runs of the same command must never overlap (they would fight over the same rows).
concurrency:
  group: manage-${{ github.event.inputs.command || github.event.schedule }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Add required reviewers on this environment to gate manual runs; scheduled runs use it too.
    environment: production
    defaults:
      run:
        working-directory: api
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_REQUIRE: "1"
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      # Media jobs delete storage objects, so they need the service-role key (never printed by the commands).
      MEDIA_STORAGE_BACKEND: supabase
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Required by settings in production (opaque storage folders); must equal the API's value.
      MEDIA_PATH_SECRET: ${{ secrets.MEDIA_PATH_SECRET }}
      # expire_recordings and send_reminders send e-mail.
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      # send_reminders builds the one-click unsubscribe URL (List-Unsubscribe) from the API origin.
      API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
      # Untrusted text goes through env vars, never straight into the shell script.
      INPUT_COMMAND: ${{ github.event.inputs.command }}
      INPUT_ARGS: ${{ github.event.inputs.args }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Resolve command
        id: resolve
        working-directory: .
        run: |
          set -euo pipefail
          ALLOWED="reconcile_speak_stats sweep_pending_attempts build_pronunciations seed_twisters expire_recordings orphan_sweeper sync_achievements build_leaderboard purge_deleted_accounts send_reminders prune_generation_usage plan_demand_report refresh_public_stats"

          if [ -n "${SCHEDULE:-}" ]; then
            case "$SCHEDULE" in
              "17 3 * * *")   command=reconcile_speak_stats ;;
              "23 * * * *")   command=expire_recordings ;;
              "41 4 * * *")   command=orphan_sweeper ;;
              "37 * * * *")   command=build_leaderboard ;;
              "53 * * * *")   command=purge_deleted_accounts ;;
              "7 * * * *")    command=send_reminders ;;
              "19 5 * * *")   command=prune_generation_usage ;;
              "41 * * * *")   command=refresh_public_stats ;;
              "*/10 * * * *") command=sweep_pending_attempts ;;
              *) echo "No command mapped to schedule '$SCHEDULE'" >&2; exit 1 ;;
            esac
            args=""
          else
            command="$INPUT_COMMAND"
            args="${INPUT_ARGS:-}"
          fi

          case " $ALLOWED " in
            *" $command "*) ;;
            *) echo "'$command' is not in the allow-list: $ALLOWED" >&2; exit 1 ;;
          esac
          if [[ -n "$args" && ! "$args" =~ ^[A-Za-z0-9_=.,:\ -]+$ ]]; then
            echo "Arguments contain unsupported characters." >&2; exit 1
          fi

          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "### \`manage.py $command $args\`" >> "$GITHUB_STEP_SUMMARY"

      # Settings refuse to start without these, and a missing DATABASE_URL would quietly fall back to an
      # empty local sqlite file, so a "successful" run would touch nothing. Fail first, say which one.
      - name: Check required secrets
        working-directory: .
        run: |
          missing=""
          for name in DJANGO_SECRET_KEY DATABASE_URL MEDIA_PATH_SECRET; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::The job runs in environment 'production' (the name must match exactly) but received no value for:$missing. Secrets (not Variables) go in Settings → Environments → production → Environment secrets, or in Repository secrets. A run only sees secrets that existed when it started, so re-run it after adding them."
            exit 1
          fi
          # send_reminders builds links from these; the job still runs without them, but the mails would fail.
          for name in WEB_BASE_URL API_PUBLIC_URL; do
            [ -n "${!name:-}" ] || echo "::warning title=Unset $name::$name is empty; send_reminders will refuse to run."
          done

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/requirements*.txt
      - run: uv venv --python 3.12
      - run: uv pip install -r requirements-dev.txt # includes cmudict, needed by build_pronunciations

      - name: Run
        env:
          COMMAND: ${{ steps.resolve.outputs.command }}
          ARGS: ${{ steps.resolve.outputs.args }}
        run: |
          set -o pipefail  # keep the command's exit code through tee
          read -r -a extra <<< "${ARGS:-}"
          uv run python manage.py "$COMMAND" "${extra[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
