name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv --python 3.12
      - run: uv pip install -r requirements-dev.txt
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Fails when a model change has no migration (spec 15 §5).
      # Test settings: in-memory sqlite and dev semantics, so no secrets and no database are needed.
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
      - run: uv run python -m pytest

  # The same suite on real Postgres: migrations (including the 0005 backfill), constraints, partial
  # indexes and row locks behave differently from sqlite, and production is Postgres.
  api-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twister
          POSTGRES_PASSWORD: twister
          POSTGRES_DB: twister
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twister"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://twister:twister@localhost:5432/twister
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv --python 3.12
      - run: uv pip install -r requirements-dev.txt
      - run: uv run python -m pytest

  # The FFmpeg media worker: pure-unit tests plus one integration test against real ffmpeg.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv --python 3.12
      - run: uv pip install -r requirements-dev.txt
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python -m pytest
