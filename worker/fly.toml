# fly.toml app configuration file generated for worker-moonlit-waterfall-8666 on 2026-10-01T00:41:44+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'worker-moonlit-waterfall-8666'
primary_region = 'lhr'
# Fly's default stop signal is SIGINT and the wait is short. The runner handles both, but be explicit:
# SIGTERM, then 30 s before SIGKILL (SHUTDOWN_GRACE_S below must stay under it).
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]

[env]
  POLL_INTERVAL_S = "15"
  FFMPEG_THREADS = "1"
  LOG_LEVEL = "INFO"
  SHUTDOWN_GRACE_S = "20"
  # Server-side spot-checks (docs/features/13). Off until the model is published and the rollout reaches A6;
  # flip with `fly secrets`-free env change: SCORING_ENABLED = "1".
  SCORING_ENABLED = "0"
  ONNX_THREADS = "1"
  MODEL_DIR = "/tmp/twister-models"
  ALLOWED_DOWNLOAD_HOSTS = "supabase.co"
  # Secrets (never here): API_BASE_URL, WORKER_SHARED_SECRET -> `fly secrets set`, see docs/runbooks/worker-deploy-fly.md

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"  # wav2vec2 int8 (~300 MB) + a 90 s clip needs headroom; 1 GB OOM-kills under load
