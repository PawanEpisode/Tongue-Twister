[project]
name = "twister-worker"
version = "0.0.0"
description = "Stateless FFmpeg media worker for Twister recordings"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# Byte-identical copy of api/twisters/speak/engine (scripts/sync_engine.py); formatted by the API's rules.
extend-exclude = ["twister_worker/engine"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns wrapping. E501 also flags comments and strings it cannot wrap.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
